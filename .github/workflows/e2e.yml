name: e2e

# Playwright end-to-end tests on all three engines. Firefox can't launch on
# the maintainer's Mac, so this job is where it gets covered.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ${{ matrix.browser }}
        working-directory: packages/react
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build core and react
        run: pnpm --filter smartrte-core build && pnpm --filter smartrte-react build
      - name: Run e2e (${{ matrix.browser }})
        working-directory: packages/react
        run: pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: packages/react/test-results
          retention-days: 7
